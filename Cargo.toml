[package]
name = "ratatui-relu"
version = "0.10.0"
edition = "2024"
repository = "https://github.com/RandyMcMillan/ratatui-relu"
description = "Continuous, differentiable layout transitions for Ratatui"
homepage = "https://github.com/RandyMcMillan/ratatui-relu"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "string", "unicode"] }
crossbeam-channel = "0.5"
crossterm = "0.29"
dirs = "5.0"
filetreelist = "0.6.0"
labtui-asyncgit = "0.28.3"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
color-eyre = "0.6"
strum = { version = "0.26", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
