name: Cache Factory

on:
  workflow_call:
    inputs:
      rust-version:
        description: Rust toolchain version to cache
        required: false
        type: string
        default: stable

jobs:
  populate-cache:
    name: Populate Rust cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}

      - name: Restore / populate cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ratatui-relu"

      - name: Build to warm cache
        run: cargo build --locked
