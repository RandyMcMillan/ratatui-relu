name: Cache Factory

on:
  workflow_call:
    inputs:
      os:
        description: Runner OS for cache
        required: false
        type: string
        default: ubuntu-latest
      rust-version:
        description: Rust toolchain version to cache
        required: false
        type: string
        default: stable

jobs:
  populate-cache:
    name: Populate Rust cache
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version || 'stable' }}

      - name: Restore / populate cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ratatui-relu"

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build to warm cache
        run: cargo build --locked

      - name: Build tests to warm dev-dependencies
        run: cargo test --locked --no-run
