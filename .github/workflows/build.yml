name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  cache-factory:
    name: Cache Factory
    uses: ./.github/workflows/cache-factory.yml
    with:
      rust-version: stable

  build:
    name: Build and test
    needs: cache-factory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ratatui-relu"

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
