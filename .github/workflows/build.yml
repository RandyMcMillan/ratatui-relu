name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      os:
        description: Runner OS
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        default: ubuntu-latest
      rust-version:
        description: Rust toolchain version
        required: true
        type: string
        default: stable
      features:
        description: Cargo features to build (optional)
        required: false
        type: string
        default: ""

jobs:
  cache-factory:
    name: Cache Factory
    uses: ./.github/workflows/cache-factory.yml
    with:
      os: ${{ inputs.os || 'ubuntu-latest' }}
      rust-version: ${{ inputs.rust-version || 'stable' }}

  build:
    name: Build and test
    needs: cache-factory
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version || 'stable' }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ratatui-relu"

      - name: Build
        run: cargo build --offline --verbose ${{ inputs.features && format('--features {0}', inputs.features) || '' }}

      - name: Test
        run: cargo test --offline --verbose ${{ inputs.features && format('--features {0}', inputs.features) || '' }}
